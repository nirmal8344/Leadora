spring.application.name=leadora
server.port=${PORT:8080}

# Database Connection with Environment Variable Overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leadora_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8344}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT & Security Configuration
leadora.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
leadora.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Bootstrap (supports LEADORA_BOOTSTRAP_* with BOOTSTRAP_* fallback)
leadora.bootstrap.admin.email=${LEADORA_BOOTSTRAP_ADMIN_EMAIL:${BOOTSTRAP_ADMIN_EMAIL:admin@leadora.com}}
leadora.bootstrap.admin.password=${LEADORA_BOOTSTRAP_ADMIN_PASSWORD:${BOOTSTRAP_ADMIN_PASSWORD:Admin@Leadora2026}}
leadora.bootstrap.marketing.password=${LEADORA_BOOTSTRAP_MARKETING_PASSWORD:${BOOTSTRAP_MARKETING_PASSWORD:Marketing@Leadora2026}}
leadora.bootstrap.sales.password=${LEADORA_BOOTSTRAP_SALES_PASSWORD:${BOOTSTRAP_SALES_PASSWORD:Sales@Leadora2026}}
leadora.bootstrap.force-reset=${LEADORA_BOOTSTRAP_FORCE_RESET:${BOOTSTRAP_FORCE_RESET:false}}

# CORS Configuration
leadora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}